[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ats-pay-range-audit"
version = "0.1.1"
description = "Read-only audit of structured salary ranges on public Greenhouse, Ashby, and Lever job boards."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "ats-pay-range-audit contributors" }]
keywords = ["greenhouse", "ashby", "lever", "salary", "job-board"]
dependencies = ["PyYAML>=6.0.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ats-pay-range-audit = "ats_pay_range_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
